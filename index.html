<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoop Legends 3D</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            color: white;
            background: rgba(0, 0, 0, 0.65);
            padding: 14px 18px;
            border-radius: 12px;
        }

        #info h1 {
            margin: 0 0 8px;
            font-size: 22px;
        }

        #info p {
            margin: 4px 0;
        }

        #scoreboard {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 14px 20px;
            border-radius: 12px;
            text-align: center;
            font-size: 18px;
        }

        #score {
            font-size: 30px;
            font-weight: bold;
        }

        #message {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 22px;
            border-radius: 12px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div id="info">
    <h1>🏀 Hoop Legends 3D</h1>
    <p>W A S D — Move</p>
    <p>SPACE — Shoot</p>
    <p>SHIFT — Sprint</p>
</div>

<div id="scoreboard">
    HOME<br>
    <span id="score">0 - 0</span>
</div>

<div id="message">
    Welcome to the court!
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


// =====================================
// SCENE
// =====================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);


// =====================================
// CAMERA
// =====================================

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 12, 18);


// =====================================
// RENDERER
// =====================================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);


// =====================================
// LIGHTING
// =====================================

const sunlight = new THREE.DirectionalLight(
    0xffffff,
    2
);

sunlight.position.set(
    10,
    20,
    10
);

sunlight.castShadow = true;

scene.add(sunlight);


const ambientLight = new THREE.AmbientLight(
    0xffffff,
    0.7
);

scene.add(ambientLight);


// =====================================
// COURT
// =====================================

const courtGeometry =
    new THREE.BoxGeometry(
        28,
        0.4,
        15
    );

const courtMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xc98245
    });

const court =
    new THREE.Mesh(
        courtGeometry,
        courtMaterial
    );

court.receiveShadow = true;

scene.add(court);


// =====================================
// COURT LINES
// =====================================

function makeLine(
    x,
    y,
    z,
    width,
    height,
    depth
) {

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const material =
        new THREE.MeshBasicMaterial({
            color: 0xffffff
        });

    const line =
        new THREE.Mesh(
            geometry,
            material
        );

    line.position.set(
        x,
        y,
        z
    );

    scene.add(line);
}


// Center line

makeLine(
    0,
    0.22,
    0,
    0.12,
    0.03,
    15
);


// =====================================
// CENTER CIRCLE
// =====================================

const circleGeometry =
    new THREE.RingGeometry(
        2.3,
        2.38,
        64
    );

const circleMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xffffff,
        side: THREE.DoubleSide
    });

const centerCircle =
    new THREE.Mesh(
        circleGeometry,
        circleMaterial
    );

centerCircle.rotation.x =
    -Math.PI / 2;

centerCircle.position.y =
    0.23;

scene.add(centerCircle);


// =====================================
// BACKBOARD
// =====================================

function createHoop(z) {

    // Backboard

    const boardGeometry =
        new THREE.BoxGeometry(
            5,
            3,
            0.25
        );

    const boardMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xffffff
        });

    const board =
        new THREE.Mesh(
            boardGeometry,
            boardMaterial
        );

    board.position.set(
        0,
        4,
        z
    );

    board.castShadow = true;

    scene.add(board);


    // Rim

    const rimGeometry =
        new THREE.TorusGeometry(
            0.75,
            0.12,
            16,
            32
        );

    const rimMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xff4500
        });

    const rim =
        new THREE.Mesh(
            rimGeometry,
            rimMaterial
        );

    rim.rotation.x =
        Math.PI / 2;

    rim.position.set(
        0,
        2.9,
        z > 0 ? z - 0.8 : z + 0.8
    );

    scene.add(rim);


    // Pole

    const poleGeometry =
        new THREE.CylinderGeometry(
            0.25,
            0.25,
            4,
            16
        );

    const poleMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x333333
        });

    const pole =
        new THREE.Mesh(
            poleGeometry,
            poleMaterial
        );

    pole.position.set(
        0,
        2,
        z
    );

    scene.add(pole);
}


createHoop(7);
createHoop(-7);


// =====================================
// PLAYER
// =====================================

const player =
    new THREE.Group();


// Body

const bodyGeometry =
    new THREE.BoxGeometry(
        1,
        2,
        0.7
    );

const bodyMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x2455ff
    });

const body =
    new THREE.Mesh(
        bodyGeometry,
        bodyMaterial
    );

body.position.y =
    1.2;

body.castShadow = true;

player.add(body);


// Head

const headGeometry =
    new THREE.SphereGeometry(
        0.45,
        24,
        24
    );

const headMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xd89b72
    });

const head =
    new THREE.Mesh(
        headGeometry,
        headMaterial
    );

head.position.y =
    2.65;

head.castShadow = true;

player.add(head);


// Player position

player.position.set(
    0,
    0,
    3
);

scene.add(player);


// =====================================
// BASKETBALL
// =====================================

const ballGeometry =
    new THREE.SphereGeometry(
        0.35,
        24,
        24
    );

const ballMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xe87920
    });

const ball =
    new THREE.Mesh(
        ballGeometry,
        ballMaterial
    );

ball.castShadow = true;

ball.position.set(
    0.8,
    1,
    3
);

scene.add(ball);


// =====================================
// CONTROLS
// =====================================

const keys = {};

document.addEventListener(
    "keydown",
    function(event) {

        keys[event.key.toLowerCase()] = true;

        if (event.code === "Space") {
            shoot();
        }
    }
);


document.addEventListener(
    "keyup",
    function(event) {

        keys[event.key.toLowerCase()] = false;
    }
);


// =====================================
// SHOOTING
// =====================================

let ballFlying = false;

let shotTime = 0;

function shoot() {

    if (ballFlying) {
        return;
    }

    ballFlying = true;

    shotTime = 0;

    document.getElementById(
        "message"
    ).textContent =
        "🏀 SHOT!";
}


// =====================================
// GAME VARIABLES
// =====================================

let homeScore = 0;
let awayScore = 0;


// =====================================
// UPDATE PLAYER
// =====================================

function updatePlayer() {

    let speed = 0.12;

    if (keys["shift"]) {
        speed = 0.22;
    }


    if (keys["w"]) {
        player.position.z -= speed;
    }

    if (keys["s"]) {
        player.position.z += speed;
    }

    if (keys["a"]) {
        player.position.x -= speed;
    }

    if (keys["d"]) {
        player.position.x += speed;
    }


    // Keep player on court

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -13,
            13
        );

    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -6.5,
            6.5
        );
}


// =====================================
// BALL
// =====================================

function updateBall() {

    if (!ballFlying) {

        ball.position.x =
            player.position.x + 0.8;

        ball.position.z =
            player.position.z;

        ball.position.y =
            1;

        return;
    }


    shotTime += 0.025;


    ball.position.x =
        player.position.x;

    ball.position.z =
        player.position.z -
        shotTime * 8;

    ball.position.y =
        1 +
        Math.sin(
            shotTime * Math.PI
        ) * 4;


    if (shotTime >= 1) {

        ballFlying = false;

        const distance =
            Math.abs(
                ball.position.z - 6
            );


        if (distance < 2) {

            homeScore += 2;

            document.getElementById(
                "message"
            ).textContent =
                "🔥 BUCKET! +2";

        } else {

            document.getElementById(
                "message"
            ).textContent =
                "❌ Miss!";

        }


        updateScore();
    }
}


// =====================================
// SCOREBOARD
// =====================================

function updateScore() {

    document.getElementById(
        "score"
    ).textContent =
        homeScore +
        " - " +
        awayScore;
}


// =====================================
// CAMERA
// =====================================

function updateCamera() {

    const targetX =
        player.position.x;

    const targetZ =
        player.position.z + 10;


    camera.position.x +=
        (targetX -
        camera.position.x) * 0.08;


    camera.position.z +=
        (targetZ -
        camera.position.z) * 0.08;


    camera.lookAt(
        player.position.x,
        1,
        player.position.z
    );
}


// =====================================
// ANIMATION LOOP
// =====================================

function animate() {

    requestAnimationFrame(
        animate
    );


    updatePlayer();

    updateBall();

    updateCamera();


    renderer.render(
        scene,
        camera
    );
}


animate();


// =====================================
// WINDOW RESIZE
// =====================================

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
