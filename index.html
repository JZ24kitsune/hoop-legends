<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hoop Legends 3D</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==============================
         MAIN MENU
    =============================== -->

    <div id="mainMenu" class="screen active">

        <div class="menu-container">

            <h1>HOOP LEGENDS</h1>

            <p class="subtitle">
                3D Basketball
            </p>

            <button id="playNowButton">
                PLAY NOW
            </button>

            <button id="createPlayerButton">
                MY PLAYER
            </button>

            <button id="teamsButton">
                MY TEAM
            </button>

            <button id="practiceButton">
                PRACTICE
            </button>

            <button id="controlsButton">
                CONTROLS
            </button>

        </div>

    </div>


    <!-- ==============================
         PLAYER CREATOR
    =============================== -->

    <div id="creatorScreen" class="screen">

        <div class="creator-container">

            <div class="creator-preview">

                <h2>PLAYER PREVIEW</h2>

                <div id="playerPreview">
                    🏀
                </div>

            </div>


            <div class="creator-controls">

                <h1>CREATE YOUR PLAYER</h1>

                <label>
                    Username
                    <input
                        id="usernameInput"
                        maxlength="16"
                        value="Player"
                    >
                </label>


                <label>
                    Player Name
                    <input
                        id="playerNameInput"
                        maxlength="20"
                        value="My Player"
                    >
                </label>


                <label>
                    Skin
                    <select id="skinInput">

                        <option value="#f2bd91">
                            Light
                        </option>

                        <option value="#c9865d">
                            Medium
                        </option>

                        <option value="#985d3d">
                            Tan
                        </option>

                        <option value="#633a29">
                            Dark
                        </option>

                    </select>
                </label>


                <label>
                    Hair
                    <select id="hairInput">

                        <option value="short">
                            Short
                        </option>

                        <option value="curly">
                            Curly
                        </option>

                        <option value="fade">
                            Fade
                        </option>

                        <option value="none">
                            None
                        </option>

                    </select>
                </label>


                <label>
                    Hair Colour
                    <select id="hairColorInput">

                        <option value="#171717">
                            Black
                        </option>

                        <option value="#4d2d1f">
                            Brown
                        </option>

                        <option value="#8b633d">
                            Light Brown
                        </option>

                        <option value="#d5b36a">
                            Blonde
                        </option>

                    </select>
                </label>


                <label>
                    Eyes
                    <select id="eyeInput">

                        <option value="#26170f">
                            Brown
                        </option>

                        <option value="#3e7198">
                            Blue
                        </option>

                        <option value="#48754d">
                            Green
                        </option>

                        <option value="#777777">
                            Grey
                        </option>

                    </select>
                </label>


                <label>
                    Face Shape
                    <select id="faceInput">

                        <option value="round">
                            Round
                        </option>

                        <option value="oval">
                            Oval
                        </option>

                        <option value="square">
                            Square
                        </option>

                    </select>
                </label>


                <label>
                    Jersey Number
                    <input
                        id="numberInput"
                        type="number"
                        min="0"
                        max="99"
                        value="7"
                    >
                </label>


                <button id="savePlayerButton">
                    SAVE PLAYER
                </button>

                <button id="creatorBackButton">
                    BACK
                </button>

            </div>

        </div>

    </div>


    <!-- ==============================
         TEAM SCREEN
    =============================== -->

    <div id="teamScreen" class="screen">

        <div class="team-container">

            <h1>MY TEAM</h1>

            <p>
                Choose your team.
            </p>

            <button class="team-choice" data-team="Legends">
                LEGENDS
            </button>

            <button class="team-choice" data-team="Titans">
                TITANS
            </button>

            <button class="team-choice" data-team="Falcons">
                FALCONS
            </button>

            <button class="team-choice" data-team="Wolves">
                WOLVES
            </button>

            <button id="teamBackButton">
                BACK
            </button>

        </div>

    </div>


    <!-- ==============================
         GAME
    =============================== -->

    <div id="gameScreen" class="screen">

        <canvas id="gameCanvas"></canvas>


        <div id="gameHUD">

            <div class="scoreboard">

                <div>

                    <small id="homeTeamName">
                        LEGENDS
                    </small>

                    <strong id="homeScore">
                        0
                    </strong>

                </div>


                <div class="game-time">

                    <strong id="gameClock">
                        04:00
                    </strong>

                    <small>
                        Q<span id="quarter">
                            1
                        </span>
                    </small>

                </div>


                <div>

                    <small>
                        TITANS
                    </small>

                    <strong id="awayScore">
                        0
                    </strong>

                </div>

            </div>


            <div id="gameMessage">
                GET READY!
            </div>

        </div>


        <button
            id="pauseButton"
            class="pause-button"
        >
            II
        </button>


        <div id="shotMeter">

            <div id="shotMeterFill"></div>

        </div>


        <div id="controlsHelp">

            <b>WASD</b> Move
            &nbsp; | &nbsp;

            <b>SPACE</b> Shoot
            &nbsp; | &nbsp;

            <b>E</b> Pass
            &nbsp; | &nbsp;

            <b>F</b> Steal

        </div>

    </div>


    <!-- ==============================
         PAUSE
    =============================== -->

    <div id="pauseScreen" class="screen">

        <div class="pause-container">

            <h1>PAUSED</h1>

            <button id="resumeButton">
                RESUME
            </button>

            <button id="restartButton">
                RESTART
            </button>

            <button id="pauseMenuButton">
                MAIN MENU
            </button>

        </div>

    </div>


    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <script type="module" src="js/main.js"></script>

</body>
</html>
