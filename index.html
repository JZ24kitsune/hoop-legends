<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hoop Legends 3D - V2</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #080808;
    }

    canvas {
        display: block;
    }

    /* TOP LEFT */

    #controls {
        position: absolute;
        top: 15px;
        left: 15px;
        z-index: 10;

        color: white;

        background: rgba(0,0,0,0.72);

        padding: 14px 18px;

        border-radius: 12px;

        border: 1px solid rgba(255,255,255,0.15);
    }

    #controls h2 {
        margin: 0 0 8px 0;
        font-size: 20px;
    }

    #controls p {
        margin: 5px 0;
        font-size: 14px;
    }

    /* SCOREBOARD */

    #scoreboard {
        position: absolute;

        top: 15px;
        left: 50%;

        transform: translateX(-50%);

        z-index: 10;

        color: white;

        background: rgba(0,0,0,0.82);

        padding: 10px 28px;

        border-radius: 14px;

        text-align: center;

        min-width: 230px;

        border: 2px solid rgba(255,255,255,0.15);
    }

    #teams {
        font-size: 13px;
        opacity: 0.8;
    }

    #score {
        font-size: 32px;
        font-weight: bold;
        margin: 3px 0;
    }

    #quarter {
        font-size: 13px;
        opacity: 0.8;
    }

    /* MESSAGE */

    #message {
        position: absolute;

        bottom: 25px;
        left: 50%;

        transform: translateX(-50%);

        z-index: 10;

        color: white;

        background: rgba(0,0,0,0.75);

        padding: 12px 25px;

        border-radius: 20px;

        font-size: 17px;

        border: 1px solid rgba(255,255,255,0.15);
    }

    /* SHOT BAR */

    #shotBar {
        position: absolute;

        bottom: 75px;
        left: 50%;

        transform: translateX(-50%);

        width: 250px;
        height: 14px;

        background: rgba(0,0,0,0.65);

        border-radius: 10px;

        overflow: hidden;

        display: none;
    }

    #shotPower {
        width: 0%;

        height: 100%;

        background: linear-gradient(
            90deg,
            #00ff66,
            #ffff00,
            #ff4400
        );
    }
</style>
</head>

<body>

<!-- CONTROLS -->

<div id="controls">

    <h2>🏀 Hoop Legends 3D</h2>

    <p><b>W A S D</b> — Move</p>

    <p><b>SHIFT</b> — Sprint</p>

    <p><b>SPACE</b> — Shoot</p>

    <p><b>R</b> — Reset ball</p>

</div>


<!-- SCOREBOARD -->

<div id="scoreboard">

    <div id="teams">
        HOME &nbsp;&nbsp; VS &nbsp;&nbsp; AWAY
    </div>

    <div id="score">
        00 - 00
    </div>

    <div id="quarter">
        Q1 &nbsp; 10:00
    </div>

</div>


<!-- MESSAGE -->

<div id="message">
    Welcome to Hoop Legends!
</div>


<!-- SHOT POWER -->

<div id="shotBar">

    <div id="shotPower"></div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


// ==================================================
// SCENE
// ==================================================

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x111827);


// ==================================================
// CAMERA
// ==================================================

const camera =
    new THREE.PerspectiveCamera(
        60,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );

camera.position.set(
    0,
    10,
    15
);


// ==================================================
// RENDERER
// ==================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;

document.body.appendChild(
    renderer.domElement
);


// ==================================================
// LIGHTING
// ==================================================

const ambient =
    new THREE.AmbientLight(
        0xffffff,
        1.0
    );

scene.add(ambient);


const mainLight =
    new THREE.DirectionalLight(
        0xffffff,
        2.5
    );

mainLight.position.set(
    5,
    20,
    8
);

mainLight.castShadow = true;

scene.add(mainLight);


// Arena lights

const light1 =
    new THREE.PointLight(
        0xffffff,
        25,
        40
    );

light1.position.set(
    -12,
    10,
    -5
);

scene.add(light1);


const light2 =
    new THREE.PointLight(
        0xffffff,
        25,
        40
    );

light2.position.set(
    12,
    10,
    5
);

scene.add(light2);


// ==================================================
// FLOOR
// ==================================================

const floorGeometry =
    new THREE.BoxGeometry(
        30,
        0.4,
        17
    );

const floorMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xb96b35,
        roughness: 0.65
    });

const floor =
    new THREE.Mesh(
        floorGeometry,
        floorMaterial
    );

floor.receiveShadow = true;

scene.add(floor);


// ==================================================
// COURT LINES
// ==================================================

const lineMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xffffff
    });


function courtLine(
    x,
    z,
    width,
    depth
) {

    const geometry =
        new THREE.BoxGeometry(
            width,
            0.035,
            depth
        );

    const line =
        new THREE.Mesh(
            geometry,
            lineMaterial
        );

    line.position.set(
        x,
        0.22,
        z
    );

    scene.add(line);
}


// Sidelines

courtLine(
    0,
    -8,
    30,
    0.12
);

courtLine(
    0,
    8,
    30,
    0.12
);


// End lines

courtLine(
    -15,
    0,
    0.12,
    16
);

courtLine(
    15,
    0,
    0.12,
    16
);


// Center line

courtLine(
    0,
    0,
    0.12,
    16
);


// ==================================================
// CENTER CIRCLE
// ==================================================

const centerRing =
    new THREE.Mesh(
        new THREE.RingGeometry(
            2.4,
            2.52,
            64
        ),
        lineMaterial
    );

centerRing.rotation.x =
    -Math.PI / 2;

centerRing.position.y =
    0.24;

scene.add(centerRing);


// ==================================================
// KEY AREAS
// ==================================================

function createKey(z) {

    const geometry =
        new THREE.BoxGeometry(
            6,
            0.035,
            5
        );

    const material =
        new THREE.MeshBasicMaterial({
            color: 0xd28a52,
            transparent: true,
            opacity: 0.8
        });

    const key =
        new THREE.Mesh(
            geometry,
            material
        );

    key.position.set(
        0,
        0.23,
        z
    );

    scene.add(key);


    // Key outline

    courtLine(
        -3,
        z - 2.5,
        0.1,
        5
    );

    courtLine(
        3,
        z - 2.5,
        0.1,
        5
    );
}

createKey(5.5);
createKey(-5.5);


// ==================================================
// ARENA WALLS
// ==================================================

const wallMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x151515
    });


function createWall(
    x,
    y,
    z,
    width,
    height,
    depth
) {

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const wall =
        new THREE.Mesh(
            geometry,
            wallMaterial
        );

    wall.position.set(
        x,
        y,
        z
    );

    scene.add(wall);
}


createWall(
    0,
    4,
    -11,
    34,
    8,
    0.5
);

createWall(
    -18,
    4,
    0,
    0.5,
    8,
    24
);

createWall(
    18,
    4,
    0,
    0.5,
    8,
    24
);


// ==================================================
// CROWD STANDS
// ==================================================

const seatMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x292929
    });


function createSeats(
    sideZ
) {

    for (
        let row = 0;
        row < 4;
        row++
    ) {

        for (
            let x = -14;
            x <= 14;
            x += 1.4
        ) {

            const seat =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        1,
                        0.35,
                        0.8
                    ),
                    seatMaterial
                );

            seat.position.set(
                x,
                0.7 + row * 0.7,
                sideZ + row * 0.9
            );

            scene.add(seat);
        }
    }
}

createSeats(-9.5);


// ==================================================
// BACKBOARD + HOOP
// ==================================================

function createBasket(
    z,
    direction
) {

    // Pole

    const pole =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.25,
                0.25,
                4.5,
                20
            ),
            new THREE.MeshStandardMaterial({
                color: 0x555555
            })
        );

    pole.position.set(
        0,
        2.3,
        z
    );

    pole.castShadow = true;

    scene.add(pole);


    // Backboard

    const board =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                5,
                3,
                0.2
            ),
            new THREE.MeshStandardMaterial({
                color: 0xf4f4f4
            })
        );

    board.position.set(
        0,
        4.5,
        z - direction * 0.8
    );

    board.castShadow = true;

    scene.add(board);


    // Backboard square

    const square =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.8,
                1.2,
                0.05
            ),
            new THREE.MeshBasicMaterial({
                color: 0xff3333
            })
        );

    square.position.set(
        0,
        4.4,
        z - direction * 0.93
    );

    scene.add(square);


    // Rim

    const rim =
        new THREE.Mesh(
            new THREE.TorusGeometry(
                0.75,
                0.11,
                16,
                32
            ),
            new THREE.MeshStandardMaterial({
                color: 0xff5a00
            })
        );

    rim.rotation.x =
        Math.PI / 2;

    rim.position.set(
        0,
        3.25,
        z - direction * 1.35
    );

    scene.add(rim);


    // Net

    const net =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.65,
                0.48,
                0.8,
                16,
                1,
                true
            ),
            new THREE.MeshBasicMaterial({
                color: 0xffffff,
                wireframe: true,
                transparent: true,
                opacity: 0.7
            })
        );

    net.position.set(
        0,
        2.85,
        z - direction * 1.35
    );

    scene.add(net);
}


createBasket(
    -7.2,
    -1
);

createBasket(
    7.2,
    1
);


// ==================================================
// PLAYER
// ==================================================

const player =
    new THREE.Group();


// Legs

function createLeg(
    x
) {

    const leg =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.16,
                0.16,
                1.2,
                12
            ),
            new THREE.MeshStandardMaterial({
                color: 0x222222
            })
        );

    leg.position.set(
        x,
        0.65,
        0
    );

    leg.castShadow = true;

    player.add(leg);
}

createLeg(-0.25);
createLeg(0.25);


// Body

const body =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.55,
            0.65,
            1.5,
            16
        ),
        new THREE.MeshStandardMaterial({
            color: 0x1557ff
        })
    );

body.position.y =
    1.65;

body.castShadow = true;

player.add(body);


// Head

const head =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            0.43,
            24,
            24
        ),
        new THREE.MeshStandardMaterial({
            color: 0xc98b65
        })
    );

head.position.y =
    2.75;

head.castShadow = true;

player.add(head);


// Arms

function createArm(
    x
) {

    const arm =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.13,
                0.13,
                1.1,
                12
            ),
            new THREE.MeshStandardMaterial({
                color: 0xc98b65
            })
        );

    arm.rotation.z =
        x > 0 ? -0.3 : 0.3;

    arm.position.set(
        x,
        1.75,
        0
    );

    arm.castShadow = true;

    player.add(arm);
}

createArm(-0.7);
createArm(0.7);


// Jersey number

const numberCanvas =
    document.createElement("canvas");

numberCanvas.width = 256;
numberCanvas.height = 256;

const ctx =
    numberCanvas.getContext("2d");

ctx.fillStyle =
    "white";

ctx.font =
    "bold 130px Arial";

ctx.textAlign =
    "center";

ctx.textBaseline =
    "middle";

ctx.fillText(
    "7",
    128,
    128
);

const numberTexture =
    new THREE.CanvasTexture(
        numberCanvas
    );

const number =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            0.7,
            0.7
        ),
        new THREE.MeshBasicMaterial({
            map: numberTexture,
            transparent: true
        })
    );

number.position.set(
    0,
    1.7,
    -0.66
);

number.rotation.y =
    Math.PI;

player.add(number);


// Player position

player.position.set(
    0,
    0,
    3
);

scene.add(player);


// ==================================================
// BASKETBALL
// ==================================================

const ball =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            0.38,
            32,
            32
        ),
        new THREE.MeshStandardMaterial({
            color: 0xe8751a,
            roughness: 0.7
        })
    );

ball.castShadow = true;

scene.add(ball);


// ==================================================
// CONTROLS
// ==================================================

const keys = {};

document.addEventListener(
    "keydown",
    event => {

        keys[
            event.key.toLowerCase()
        ] = true;

        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            startShot();
        }

        if (
            event.key.toLowerCase() === "r"
        ) {

            resetBall();
        }
    }
);


document.addEventListener(
    "keyup",
    event => {

        keys[
            event.key.toLowerCase()
        ] = false;
    }
);


// ==================================================
// GAME VARIABLES
// ==================================================

let homeScore = 0;

let awayScore = 0;

let shooting = false;

let shotProgress = 0;

let shotPower = 0;

let shotDirection = -1;


// ==================================================
// MOVEMENT
// ==================================================

function updatePlayer() {

    let speed =
        keys["shift"]
            ? 0.20
            : 0.11;


    if (keys["w"])
        player.position.z -= speed;

    if (keys["s"])
        player.position.z += speed;

    if (keys["a"])
        player.position.x -= speed;

    if (keys["d"])
        player.position.x += speed;


    // Keep player on court

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -13.5,
            13.5
        );

    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -6.5,
            6.5
        );


    // Player turning

    if (keys["a"])
        player.rotation.y =
            Math.PI / 2;

    if (keys["d"])
        player.rotation.y =
            -Math.PI / 2;

    if (keys["w"])
        player.rotation.y = 0;

    if (keys["s"])
        player.rotation.y =
            Math.PI;
}


// ==================================================
// BALL FOLLOW
// ==================================================

function followBall() {

    if (shooting)
        return;


    ball.position.x =
        player.position.x + 0.75;

    ball.position.z =
        player.position.z;

    ball.position.y =
        1.0 +
        Math.abs(
            Math.sin(
                performance.now() * 0.008
            )
        ) * 0.15;
}


// ==================================================
// SHOOTING
// ==================================================

function startShot() {

    if (shooting)
        return;


    shooting = true;

    shotProgress = 0;

    shotPower = 0.85;

    document.getElementById(
        "message"
    ).textContent =
        "🏀 SHOOTING!";

    document.getElementById(
        "shotBar"
    ).style.display =
        "block";

    document.getElementById(
        "shotPower"
    ).style.width =
        "85%";
}


// ==================================================
// UPDATE SHOT
// ==================================================

function updateShot() {

    if (!shooting)
        return;


    shotProgress += 0.025;


    const startX =
        player.position.x;

    const startZ =
        player.position.z;


    // Ball moves toward far hoop

    ball.position.x =
        startX;

    ball.position.z =
        startZ -
        shotProgress * 7;


    // Shooting arc

    ball.position.y =
        1.5 +
        Math.sin(
            shotProgress * Math.PI
        ) * 4;


    // Spin

    ball.rotation.x +=
        0.25;


    if (
        shotProgress >= 1
    ) {

        shooting = false;

        document.getElementById(
            "shotBar"
        ).style.display =
            "none";


        // Basic scoring detection

        if (
            Math.abs(
                ball.position.x
            ) < 1.4
            &&
            Math.abs(
                ball.position.z + 7
            ) < 1.5
        ) {

            homeScore += 2;

            document.getElementById(
                "message"
            ).textContent =
                "🔥 BUCKET! +2";

        } else {

            document.getElementById(
                "message"
            ).textContent =
                "❌ Miss!";

        }


        updateScore();

        setTimeout(
            resetBall,
            900
        );
    }
}


// ==================================================
// RESET BALL
// ==================================================

function resetBall() {

    shooting = false;

    ball.position.set(
        player.position.x + 0.75,
        1,
        player.position.z
    );

    document.getElementById(
        "shotBar"
    ).style.display =
        "none";
}


// ==================================================
// SCOREBOARD
// ==================================================

function updateScore() {

    document.getElementById(
        "score"
    ).textContent =

        String(homeScore)
            .padStart(2, "0")

        +

        " - "

        +

        String(awayScore)
            .padStart(2, "0");
}


// ==================================================
// CAMERA
// ==================================================

function updateCamera() {

    const desiredX =
        player.position.x;

    const desiredZ =
        player.position.z + 10;


    camera.position.x +=
        (
            desiredX -
            camera.position.x
        ) * 0.08;


    camera.position.z +=
        (
            desiredZ -
            camera.position.z
        ) * 0.08;


    camera.lookAt(
        player.position.x,
        1.4,
        player.position.z
    );
}


// ==================================================
// GAME LOOP
// ==================================================

function animate() {

    requestAnimationFrame(
        animate
    );


    updatePlayer();

    if (!shooting) {

        followBall();

    } else {

        updateShot();

    }

    updateCamera();


    renderer.render(
        scene,
        camera
    );
}


animate();


// ==================================================
// RESIZE
// ==================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
